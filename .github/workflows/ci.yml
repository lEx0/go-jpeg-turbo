name: CI

# Pushes run CI on main only; other branches run it through their pull
# request (a branch with an open pull request would otherwise get two
# identical runs), or by hand from the Actions tab.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The jobs only read the repository.
permissions:
  contents: read

# A new push to a pull request cancels the run of its previous commit.
# Pushes to main and runs by hand get a group of their own (the run id),
# so that every commit on main is tested: in a shared group GitHub keeps
# one run going and one pending, and a newer run cancels the pending one,
# so the middle one of three quick pushes would get no result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # setup-go restores a build cache saved by an earlier run, test results
  # included. Go keys a cached result on the test binary and on the files
  # and environment variables the test read, not on the CPU, and the CPU
  # decides which kernels run: GitHub's amd64 runners get different CPUs
  # from run to run (see the levels job), so a pass cached on one could
  # stand in for kernels another never ran. -count=1 makes every go test
  # run.
  GOFLAGS: -count=1

# bash on Windows too (Git Bash), so that every step is written once.
defaults:
  run:
    shell: bash

# Every action is pinned to the commit of a release, named in the comment
# after it: a tag can be moved to other code, a commit cannot. Dependabot
# moves the pins to new releases (.github/dependabot.yml).

# Where the tests run in full and where with -short (fewer inputs in the
# compatibility sweeps, a dozen alpha values instead of 256 in the
# exhaustive NRGBA conversion tests, no TestGenerated), and the job
# timeouts, come from the first run on GitHub (run 45177341901). Whole
# jobs, including checkout and setup:
#
#   test, ubuntu-latest      12.5 min  AMD EPYC 7763, AVX2 (Test 407 s,
#                                      purego 307 s); 9.5 min on a Xeon
#                                      6975P-C with AVX-512 and coverage
#   test, ubuntu-24.04-arm    8 min    (Test 215 s, purego 229 s)
#   test, macos-latest        2.5 min  -short
#   test, windows-latest      3 min    -short
#   levels                   11.5 min  four levels on an EPYC 9V74 (AVX-512)
#   race                     12.5 min  amd64; 10.5 min on arm64
#   ports                     2.5 min
#
# Each timeout is about three times the slowest of these, because the
# runners' CPUs differ from run to run. go test's own -timeout (10
# minutes by default) is set below each job's, so that a hung test fails
# with its goroutine dump instead of the job being cancelled.

jobs:
  test:
    name: test (${{ matrix.os }}, Go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm is native linux/arm64 and macos-latest is
        # darwin/arm64 (the NEON kernels); ubuntu-latest and windows-latest
        # are amd64 (the SSE4.1, AVX2 and AVX-512 kernels, up to the level
        # of the CPU the run gets). "stable" becomes the next Go release as
        # soon as it is out: the tests compare with the image/jpeg of the
        # toolchain that runs them, so that leg is the first to see a
        # change there.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        go: ["1.27", "stable"]
        include:
          # The Linux legs run the tests in full. macOS and Windows run the
          # same assembly as the Linux legs of their architecture (Go's
          # assembly ABI does not depend on the OS), so their full sweeps
          # would prove nothing new; they run -short, every kernel at every
          # level on fewer inputs.
          - os: macos-latest
            testflags: -short
          - os: windows-latest
            testflags: -short
          # Coverage for the job summary and Codecov, from one leg.
          - os: ubuntu-latest
            go: stable
            coverage: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # setup-go keys its module and build cache on the runner OS and
      # image, the architecture, the Go version and go.sum, not on the
      # job, and saves it only when no entry has that key yet: the first
      # job to finish on a runner image saves it for every job there.
      # Only this job saves and restores it, so that the entry holds the
      # builds of these steps and not those of the race, levels or ports
      # job (cache: false there).
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ matrix.go }}
      # The amd64 kernels are picked at run time by CPU level and the tests
      # run every level up to the runner's: log which one that is.
      - name: Log the detected x86 SIMD level
        if: runner.arch == 'X64'
        run: |
          if [ -r /proc/cpuinfo ]; then grep -m1 'model name' /proc/cpuinfo; fi
          go test -v -run TestLevelsConsistent ./internal/cpuinfo
      - name: Check formatting
        if: runner.os == 'Linux'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi
      # Both modules: the library's and the benchmarks' (benchmarks/).
      - name: Check that go.mod and go.sum are tidy
        if: runner.os == 'Linux'
        run: |
          go mod tidy -diff
          (cd benchmarks && go mod tidy -diff)
      - name: Build without cgo
        env:
          CGO_ENABLED: "0"
        run: go build ./...
      # The library part of make vet: the default and purego builds, the
      # assembly of both architectures (asmdecl) whatever the runner is,
      # the examples and _tools/gencorpus, which ./... skips (see "Run
      # examples"), and levels.go, which make levels runs and whose
      # ignore tag keeps it out of ./... (a file needs a go vet of its
      # own). The benchmark module has its own step below.
      - name: Vet
        run: |
          go vet ./... ./_examples/decode ./_examples/encode ./_examples/batch ./_tools/gencorpus
          go vet internal/cpuinfo/levels.go
          go vet -tags purego ./...
          GOARCH=amd64 go vet ./...
          GOARCH=arm64 go vet ./...
      # TestGenerated, which -short skips, on every leg: on Windows it also
      # checks that the checkout kept the LF line endings (.gitattributes).
      - name: Check that the assembly is what its generators write
        run: go test -run '^TestGenerated$' ./internal/dct
      # _examples starts with "_", so ./... (build, vet, test) skips it:
      # run the examples explicitly, from the repository root as documented.
      # They write under the temporary directory; batch with -out '' only
      # re-encodes the JPEG files of testdata, on GOMAXPROCS goroutines.
      - name: Run examples
        run: |
          go run ./_examples/decode
          go run ./_examples/encode
          go run ./_examples/batch -out ''
      # benchmarks/ is a separate module, which ./... does not reach. It
      # imports internal/cpuinfo, internal/dct and internal/ycc, so it
      # breaks when those change. Its TestSameAsStd compares this package
      # with image/jpeg on the benchmark workloads; -short leaves out the
      # 12 MP ones, which would generate 50 MB of inputs first.
      - name: Vet and test the benchmark module
        working-directory: benchmarks
        run: |
          go vet ./...
          go vet -tags purego ./...
          go test -short ./...
      # The guard-page tests (internal/dct, internal/ycc, jpeg) need mmap
      # and mprotect and are built on Linux and macOS only.
      - name: Test
        run: go test ${{ matrix.testflags }} -timeout 30m ./...
      # -coverpkg counts the code that other packages' tests run too
      # (internal/imageutil has no tests of its own). -short, after the
      # full run above: on amd64 the exhaustive tests of level go run the
      # instrumented portable kernels on every thread, and the updates of
      # the shared coverage counters made internal/ycc about 5 times
      # slower in full (79 s to 380 s as amd64 under Rosetta, GOMAXPROCS=4;
      # on arm64 the kernels are NEON assembly, which is not instrumented).
      # -short covers nearly the same statements (98.05% against 98.12%).
      - name: Test with coverage
        if: matrix.coverage
        run: go test -short -timeout 30m -coverpkg=./... -coverprofile=coverage.txt ./...
      # The assembly kernels are compared with the portable Go code they
      # replace by the tests above; this runs the whole suite on the
      # portable code as well (what other architectures use).
      - name: Test the pure Go code path (-tags purego)
        run: go test ${{ matrix.testflags }} -timeout 30m -tags purego ./...
      - name: Coverage summary
        if: matrix.coverage
        continue-on-error: true
        run: |
          {
            echo "### Coverage: $(go tool cover -func=coverage.txt | tail -1 | awk '{print $NF}') of statements"
            echo
            echo "Linux amd64 at the runner's SIMD level, every package's tests"
            echo "(-short) counting for the whole module (-coverpkg=./...). Go"
            echo "coverage does not see inside the assembly kernels."
            echo
            echo "| Package | Statements | Covered |"
            echo "|---|---:|---:|"
            # A block appears once per test binary: count it once, as
            # covered if any of them ran it.
            awk -F'[: ]' -v mod="$(go list -m)/" 'NR > 1 {
                b = $1 ":" $2; n[b] = $3; if ($4 > 0) hit[b] = 1
              }
              END {
                for (b in n) {
                  p = b; sub(/\/[^\/]*:.*$/, "", p); sub(mod, "", p)
                  all[p] += n[b]; if (b in hit) cov[p] += n[b]
                }
                for (p in all) printf "| %s | %d | %.1f%% |\n", p, all[p], 100 * cov[p] / all[p]
              }' coverage.txt | sort
            echo
            echo "<details><summary>Per function</summary>"
            echo
            echo '```'
            go tool cover -func=coverage.txt
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
      # The upload runs only with a CODECOV_TOKEN secret: main is a
      # protected branch, for which Codecov refuses tokenless uploads, and
      # pull requests from forks get no secrets. A step's if cannot read
      # secrets, so this step tells whether there is one; the token itself
      # reaches only these two steps, not the go commands that run the
      # pull request's code.
      - name: Check for a Codecov token
        id: codecov
        if: matrix.coverage
        env:
          TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: echo "has=${TOKEN:+1}" >> "$GITHUB_OUTPUT"
      # A failed upload does not fail the job.
      - name: Upload coverage to Codecov
        if: steps.codecov.outputs.has == '1'
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.txt
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

  levels:
    # go test ./jpeg once per JPEG_TURBO_LEVEL the runner supports (make
    # levels): the comparisons with image/jpeg through each level's
    # kernels, which the test job runs at the highest level only
    # (internal/dct and internal/ycc test every level themselves). Levels
    # the CPU lacks are not run, and the tests that need one skip. The
    # CPU differs from run to run, and the job logs it: GitHub's amd64
    # runners are AMD EPYC without AVX-512 (Zen 3) or with it and VNNI
    # (Zen 4), and Intel Xeon with AVX-512, with VNNI or, on Skylake-SP,
    # without it. So whether a run tests the AVX-512 kernels at all, and
    # internal/ycc's fallback for AVX-512 without VNNI on real hardware,
    # depends on the machine it gets: a regression in an AVX-512 kernel
    # can pass a pull request that ran on an AVX2-only CPU.
    name: SIMD levels (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          cache: false # see the test job
      - name: Log the detected x86 SIMD level
        run: |
          grep -m1 'model name' /proc/cpuinfo
          go test -v -run TestLevelsConsistent ./internal/cpuinfo
      - name: Test ./jpeg at every level
        run: make levels

  race:
    name: race (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux on both architectures: the race detector needs cgo, which
        # the runners' C toolchain provides.
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    # Nearly all of the time is the jpeg tests on one thread.
    timeout-minutes: 40
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          cache: false # see the test job
      # -short: the race detector makes the input sweeps about 8 times
      # slower and gains little from their full size (the codec runs on
      # the calling goroutine; TestEncConcurrent, TestConcurrent and
      # TestReentrant cover concurrent and re-entrant use).
      # The jpeg tests imply -short under -race anyway (raceShort), and
      # internal/ycc converts a sample of its exhaustive inputs.
      - name: Test with the race detector
        run: go test -race -short -timeout 30m ./...
      # Memory accesses made by assembly are invisible to the race
      # detector: also race-check the portable kernels, which read and
      # write the same buffers.
      - name: Test with the race detector (-tags purego)
        run: go test -race -short -timeout 30m -tags purego ./...

  ports:
    name: other architectures
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          cache: false # see the test job
      # The portable code on a 32-bit architecture, which the amd64 runner
      # runs natively (no assembly is built for 386), with -short.
      - name: Test on 32-bit (linux/386)
        env:
          GOARCH: "386"
          CGO_ENABLED: "0"
        run: go test -short -timeout 15m ./...
      # Build and vet errors on 32-bit, big-endian and wasm targets, and
      # on an OS without the guard-page tests.
      - name: Vet other architectures (make vet-ports)
        run: make vet-ports
