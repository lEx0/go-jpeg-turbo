name: CI

# Pushes run CI on main only; other branches run it through their pull
# request (a branch with an open pull request would otherwise get two
# identical runs), or by hand from the Actions tab.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The jobs only read the repository.
permissions:
  contents: read

# A new push to a pull request cancels the run of its previous commit;
# runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # setup-go restores a build cache saved by an earlier run, test results
  # included. Go keys a cached result on the test binary and on the files
  # and environment variables the test read, not on the CPU, and the CPU
  # decides which kernels run: GitHub's amd64 runners are AMD EPYC without
  # AVX-512 or Intel Xeon with it, so a pass cached on one could stand in
  # for kernels the other never ran. -count=1 makes every go test run.
  GOFLAGS: -count=1

# bash on Windows too (Git Bash), so that every step is written once.
defaults:
  run:
    shell: bash

# Test times, which decide where the tests run in full and where with
# -short (fewer inputs in the compatibility sweeps, a dozen alpha values
# instead of 256 in the exhaustive NRGBA conversion tests, no
# TestGenerated). Wall times on an Apple M5 Pro with GOMAXPROCS=4, one
# package at a time, natively and as amd64 under Rosetta:
#
#                                    -short    full
#   arm64 (NEON)    internal/dct        1 s     9 s
#                   internal/ycc        2 s    22 s   all 4 threads busy
#                   jpeg               10 s    82 s   about 1 thread
#                   -tags purego       23 s   130 s   (jpeg; ycc 70 s)
#                   -race -short      110 s           (jpeg; purego 161 s;
#                                                      dct, ycc < 15 s)
#   amd64, Rosetta  internal/dct        3 s    20 s   levels go, sse41,
#                   internal/ycc        6 s    94 s   avx2; all 4 threads
#                   jpeg               15 s   104 s   76 to 104 s per level
#
# In a Linux container limited to 4 CPUs on the same machine, whole steps
# (packages in parallel) took, on arm64: 91 s (go test ./..., full), 96 s
# (purego, full), 124 s and 145 s (the two race steps), 80 s (make
# levels, one level); as amd64 under Rosetta, up to avx2: 179 s (go test
# ./..., full) and 295 s (make levels, three levels).
#
# GitHub's runners are slower: the amd64 ones have 4 vCPUs on 2 cores
# (SMT), the arm64 ones 4 slower cores, macos-latest 3 vCPUs. The
# estimates below count 2.5x the time above for one thread and 4x for
# four, then double that as a margin (Rosetta, slower than native code,
# adds to it); each job's timeout is well above its estimate. go test's
# own -timeout (10 minutes by default) is set below each job's, so that a
# hung test fails with its goroutine dump instead of the job being
# cancelled.

jobs:
  test:
    name: test (${{ matrix.os }}, Go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm is native linux/arm64 and macos-latest is
        # darwin/arm64 (the NEON kernels); ubuntu-latest and windows-latest
        # are amd64 (the SSE4.1, AVX2 and AVX-512 kernels, up to the runner
        # CPU's level). "stable" becomes the next Go release as soon as it
        # is out: the tests compare with the image/jpeg of the toolchain
        # that runs them, so that leg is the first to see a change there.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        go: ["1.27", "stable"]
        include:
          # The Linux legs run the tests in full: estimated 35 minutes on
          # amd64 (17 without the margin: the exhaustive kernel tests at
          # every level next to jpeg, then the purego suite) and 22 on
          # arm64. macOS and Windows run the same assembly as the Linux
          # legs of their architecture (Go's assembly ABI does not depend
          # on the OS), so their full sweeps would prove nothing new; they
          # run -short, every kernel at every level on fewer inputs, in an
          # estimated 6 (macOS) and 13 (Windows) minutes.
          - os: macos-latest
            testflags: -short
          - os: windows-latest
            testflags: -short
          # Coverage for the job summary and Codecov, from one leg.
          - os: ubuntu-latest
            go: stable
            coverage: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    env:
      # Mapped here so that the upload step can be skipped when the
      # repository has no such secret (pull requests from forks get none).
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      # The amd64 kernels are picked at run time by CPU level and the tests
      # run every level up to the runner's: log which one that is.
      - name: Log the detected x86 SIMD level
        if: runner.arch == 'X64'
        run: |
          if [ -r /proc/cpuinfo ]; then grep -m1 'model name' /proc/cpuinfo; fi
          go test -v -run TestLevelsConsistent ./internal/cpuinfo
      - name: Check formatting
        if: runner.os == 'Linux'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi
      - name: Check that go.mod and go.sum are tidy
        if: runner.os == 'Linux'
        run: go mod tidy -diff
      - name: Build without cgo
        env:
          CGO_ENABLED: "0"
        run: go build ./...
      # make vet, plus the examples: the default and purego builds, and the
      # assembly of both architectures (asmdecl) whatever the runner is.
      - name: Vet
        run: |
          go vet ./... ./_examples/decode ./_examples/encode
          go vet -tags purego ./...
          GOARCH=amd64 go vet ./...
          GOARCH=arm64 go vet ./...
      # TestGenerated, which -short skips, on every leg: on Windows it also
      # checks that the checkout kept the LF line endings (.gitattributes).
      - name: Check that the assembly is what its generators write
        run: go test -run '^TestGenerated$' ./internal/dct
      # _examples starts with "_", so ./... (build, vet, test) skips it:
      # run the examples explicitly, from the repository root as documented.
      - name: Run examples
        run: |
          go run ./_examples/decode
          go run ./_examples/encode
      # benchmarks/ is a separate module, which ./... does not reach.
      - name: Vet the benchmark module
        working-directory: benchmarks
        run: go vet ./...
      # The guard-page tests (internal/dct, internal/ycc) need mmap and
      # mprotect and are built on Linux and macOS only.
      - name: Test
        if: ${{ !matrix.coverage }}
        run: go test ${{ matrix.testflags }} -timeout 30m ./...
      # -coverpkg counts the code that other packages' tests run too
      # (internal/imageutil has no tests of its own) and costs no time
      # (78 s against 82 s, M5 Pro arm64).
      - name: Test with coverage
        if: matrix.coverage
        run: go test ${{ matrix.testflags }} -timeout 30m -coverpkg=./... -coverprofile=coverage.txt ./...
      # The assembly kernels are compared with the portable Go code they
      # replace by the tests above; this runs the whole suite on the
      # portable code as well (what other architectures use).
      - name: Test the pure Go code path (-tags purego)
        run: go test ${{ matrix.testflags }} -timeout 30m -tags purego ./...
      - name: Coverage summary
        if: matrix.coverage
        continue-on-error: true
        run: |
          {
            echo "### Coverage: $(go tool cover -func=coverage.txt | tail -1 | awk '{print $NF}') of statements"
            echo
            echo "Linux amd64 at the runner's SIMD level, every package's tests"
            echo "counting for the whole module (-coverpkg=./...). Go coverage"
            echo "does not see inside the assembly kernels."
            echo
            echo "| Package | Statements | Covered |"
            echo "|---|---:|---:|"
            # A block appears once per test binary: count it once, as
            # covered if any of them ran it.
            awk -F'[: ]' -v mod="$(go list -m)/" 'NR > 1 {
                b = $1 ":" $2; n[b] = $3; if ($4 > 0) hit[b] = 1
              }
              END {
                for (b in n) {
                  p = b; sub(/\/[^\/]*:.*$/, "", p); sub(mod, "", p)
                  all[p] += n[b]; if (b in hit) cov[p] += n[b]
                }
                for (p in all) printf "| %s | %d | %.1f%% |\n", p, all[p], 100 * cov[p] / all[p]
              }' coverage.txt | sort
            echo
            echo "<details><summary>Per function</summary>"
            echo
            echo '```'
            go tool cover -func=coverage.txt
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
      # Only with a CODECOV_TOKEN secret: main is a protected branch, for
      # which Codecov refuses tokenless uploads. A failed upload does not
      # fail the job.
      - name: Upload coverage to Codecov
        if: matrix.coverage && env.CODECOV_TOKEN != ''
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          files: coverage.txt
          disable_search: true
          token: ${{ env.CODECOV_TOKEN }}

  levels:
    # go test ./jpeg once per JPEG_TURBO_LEVEL the runner supports (make
    # levels): the comparisons with image/jpeg through each level's
    # kernels, which the test job runs at the highest level only
    # (internal/dct and internal/ycc test every level themselves). Levels
    # the CPU lacks (AVX-512 on the AMD runners) are not run, and the
    # tests that need one skip. In full: estimated 32 minutes for four
    # levels (16 without the margin).
    name: SIMD levels (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Log the detected x86 SIMD level
        run: |
          grep -m1 'model name' /proc/cpuinfo
          go test -v -run TestLevelsConsistent ./internal/cpuinfo
      - name: Test ./jpeg at every level
        run: make levels

  race:
    name: race (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux on both architectures: the race detector needs cgo, which
        # the runners' C toolchain provides.
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    # Estimated 24 minutes (12 without the margin), nearly all of it the
    # jpeg tests on one thread.
    timeout-minutes: 45
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      # -short: the race detector makes the input sweeps about 8 times
      # slower and gains little from their full size (the codec runs on
      # the calling goroutine; TestEncConcurrent covers concurrent use).
      # The jpeg tests imply -short under -race anyway (raceShort), and
      # internal/ycc converts a sample of its exhaustive inputs.
      - name: Test with the race detector
        run: go test -race -short -timeout 30m ./...
      # Memory accesses made by assembly are invisible to the race
      # detector: also race-check the portable kernels, which read and
      # write the same buffers.
      - name: Test with the race detector (-tags purego)
        run: go test -race -short -timeout 30m -tags purego ./...

  ports:
    name: other architectures
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      # The portable code on a 32-bit architecture, which the amd64 runner
      # runs natively (no assembly is built for 386). -short: the job is
      # estimated at 6 minutes (3 without the margin).
      - name: Test on 32-bit (linux/386)
        env:
          GOARCH: "386"
          CGO_ENABLED: "0"
        run: go test -short -timeout 15m ./...
      # Build and vet errors on 32-bit, big-endian and wasm targets, and
      # on an OS without the guard-page tests.
      - name: Vet other architectures (make vet-ports)
        run: make vet-ports
